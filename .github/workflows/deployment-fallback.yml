name: Deployment Fallback

on:
  status:
  workflow_dispatch:
    inputs:
      source_provider:
        description: "Provider that failed"
        required: false
        default: "vercel"
      force_render:
        description: "Trigger Render fallback"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  render-fallback:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.force_render == true) ||
      (github.event_name == 'status' &&
       github.event.context == 'Vercel' &&
       github.event.state == 'failure')
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
    steps:
      - name: Trigger configured Render free-service deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured; no external resource was created."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Health check
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "::notice::RENDER_SERVICE_URL is not configured; health check skipped."
            exit 0
          fi
          URL="${RENDER_SERVICE_URL%/}/api/healthz"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "$URL"; then
              echo "Render fallback healthy: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Render fallback did not pass /api/healthz"
          exit 1
