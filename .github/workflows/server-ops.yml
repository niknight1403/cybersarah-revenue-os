# CyberSarah Revenue OS — Server-Operationen via SSH
#
# Der Hetzner-VPS (167.233.196.20, /opt/cybersarah, pm2-Prozess "cybersarah")
# laeuft hinter einem Nginx-Reverse-Proxy. Wenn das Backend (Port 3000) down
# ist, antwortet der Proxy mit 502 — der API-Deploy und Env-Sync koennen dann
# nichts mehr ausrichten. Dieser Workflow nutzt die HETZNER_SSH_* Secrets und
# greift direkt per SSH zu:
#
#   modus=diagnose  — Nur lesen: pm2-Status, Logs, Ressourcen, Health-Check
#   modus=reparatur — Diagnose + Fix: git pull, .env-Sync, pnpm install,
#                     Build, pm2-Restart, Health-Verifikation
name: Server-Ops (SSH)

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "diagnose oder reparatur"
        required: true
        default: "diagnose"
        type: choice
        options: [diagnose, reparatur]

jobs:
  server-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH-Key einrichten
        env:
          SSH_KEY_B64: ${{ secrets.HETZNER_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Modus validieren
        env:
          MODUS: ${{ github.event.inputs.modus }}
        run: |
          case "$MODUS" in
            diagnose|reparatur) echo "Modus: $MODUS" ;;
            *) echo "::error::Unbekannter Modus: $MODUS"; exit 1 ;;
          esac

      - name: DEPLOY_TOKEN auf Server angleichen (nur Reparatur)
        if: github.event.inputs.modus == 'reparatur'
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          TOKEN_WERT: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          printf '%s' "$TOKEN_WERT" | ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'read -r NEU; [ -n "$NEU" ] || { echo "Token leer — abbruch"; exit 1; }
            if grep -q "^DEPLOY_TOKEN=" /opt/cybersarah/.env; then
              sed -i "s#^DEPLOY_TOKEN=.*#DEPLOY_TOKEN=$NEU#" /opt/cybersarah/.env
            else
              printf "\nDEPLOY_TOKEN=%s\n" "$NEU" >> /opt/cybersarah/.env
            fi
            echo "DEPLOY_TOKEN in /opt/cybersarah/.env aktualisiert (Laenge: ${#NEU})"'

      - name: Token-Verifikation (Längen + echter Endpoint-Test)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          LOKAL=$(printf '%s' "$DEPLOY_TOKEN" | wc -c)
          echo "Runner-Secret DEPLOY_TOKEN Laenge: $LOKAL"
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'echo "root .env Token-Laenge: $(grep "^DEPLOY_TOKEN=" /opt/cybersarah/.env | cut -d= -f2 | tr -d "\n" | wc -c)"; echo "api .env Token-Laenge: $(grep "^DEPLOY_TOKEN=" /opt/cybersarah/artifacts/api-server/.env 2>/dev/null | cut -d= -f2 | tr -d "\n" | wc -c)"; echo "pm2-Env DEPLOY_TOKEN: $(pm2 env cybersarah 2>/dev/null | grep -c DEPLOY_TOKEN)"'
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'echo "== .env-Uebersicht =="; ls -la /opt/cybersarah/.env* /opt/cybersarah/artifacts/api-server/.env* 2>/dev/null | head -10; echo "root .env Keys:"; grep -oE "^[A-Z_0-9]+" /opt/cybersarah/.env 2>/dev/null | sort | tr "\n" " "; echo; echo "api .env Keys:"; grep -oE "^[A-Z_0-9]+" /opt/cybersarah/artifacts/api-server/.env 2>/dev/null | sort | tr "\n" " "; echo; echo "== Postgres =="; systemctl is-active postgresql 2>/dev/null; sudo -u postgres psql -lqt 2>/dev/null | cut -d"|" -f1 | tr -s " " | grep -v "^$" | head -8; echo "== DATABASE_URL-Quellen =="; grep -rl "DATABASE_URL" /opt/cybersarah --include="*.env*" --include="*.bak*" --include="*.example" --include="*.env" 2>/dev/null | head -6'
          echo "Runner-Secret MD5: $(printf '%s' "$DEPLOY_TOKEN" | md5sum | cut -d' ' -f1)"
          CODE=$(curl -sk -o /tmp/tok_test -w '%{http_code}' -m 15 -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://$SSH_HOST/api/admin/env")
          echo "Env-Endpoint (GET, mit echtem Token): HTTP $CODE"
          head -c 250 /tmp/tok_test; echo
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'TOK=$(grep "^DEPLOY_TOKEN=" /opt/cybersarah/artifacts/api-server/.env | cut -d= -f2 | tr -d "\n")
            echo "api .env Token MD5: $(printf "%s" "$TOK" | md5sum | cut -d\  -f1)"
            echo "Env-Endpoint lokal mit .env-Token:"
            curl -s -m 10 -X POST -H "X-Deploy-Token: $TOK" -H "Content-Type: application/json" -d "{}" -w "\nHTTP %{http_code}\n" http://127.0.0.1:3000/api/admin/env | head -c 400' 

      - name: Port-3000-Prozess forensik
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'PPID3000=$(ss -tlnp 2>/dev/null | grep ":3000" | grep -oE "pid=[0-9]+" | head -1 | cut -d= -f2)
            echo "Port-3000-PID: $PPID3000"
            [ -n "$PPID3000" ] || exit 0
            echo "cwd: $(readlink /proc/$PPID3000/cwd 2>/dev/null)"
            ps -o pid,ppid,user,lstart --no-headers -p $PPID3000 2>/dev/null
            echo "DEPLOY_TOKEN in spawn-env: $(tr "\0" "\n" < /proc/$PPID3000/environ 2>/dev/null | grep -c "^DEPLOY_TOKEN=")"
            echo "spawn-env DEPLOY_TOKEN MD5: $(tr "\0" "\n" < /proc/$PPID3000/environ 2>/dev/null | grep "^DEPLOY_TOKEN=" | cut -d= -f2 | tr -d "\n" | md5sum | cut -d\  -f1)"
            echo "cmdline: $(tr "\0" " " < /proc/$PPID3000/cmdline 2>/dev/null | head -c 200)"'

      - name: Rogue-Prozess- und DB-URL-Diagnose
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'echo "== Rogue dist/index.js Prozesse =="
            for pr in $(pgrep -f "node dist/index[.]js" 2>/dev/null); do echo "PID $pr: cgroup=$(cat /proc/$pr/cgroup 2>/dev/null | head -1) cwd=$(readlink /proc/$pr/cwd 2>/dev/null) ppid=$(ps -o ppid= -p $pr)"; done
            echo "== Wer referenziert die verschachtelte Kopie? =="
            grep -l "cybersarah-revenue-os" /srv/cybersarah-loop-agent/*.mjs 2>/dev/null | head -3
            grep -n "dist/index" /srv/cybersarah-loop-agent/agent.mjs 2>/dev/null | head -5 || true
            echo "== crontabs =="
            crontab -l 2>/dev/null | grep -iE "dist|cybersarah-revenue|node" | head -5
            crontab -l -u cybersarah 2>/dev/null | grep -iE "dist|node" | head -5 || true
            ls /etc/cron.d/ 2>/dev/null | head -10
            echo "== systemd timer =="; systemctl list-timers --all --no-pager 2>/dev/null | grep -i cyber | head -5 || true
            echo "== .env.backup DATABASE_URL =="
            grep "^DATABASE_URL=" /opt/cybersarah/.env.backup 2>/dev/null | cut -d= -f2 | tr -d "\n" | wc -c
            DBURL=$(grep "^DATABASE_URL=" /opt/cybersarah/.env.backup 2>/dev/null | cut -d= -f2 | tr -d "\n")
            [ -n "$DBURL" ] && PGPASSWORD=$(echo "$DBURL" | sed -nE "s#.*:([^@]+)@[^:]+.*#\1#p") psql "host=127.0.0.1 dbname=cybersarah user=cybersarah" -tAc "select 1" 2>&1 | head -2 || true
            echo "== pm2 status =="; pm2 jlist 2>/dev/null | head -c 600; echo'

      - name: Diagnose (immer)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" '
            echo "== pm2 status =="; pm2 status 2>&1 | head -15
            echo "== pm2 logs cybersarah (letzte 30 Zeilen) =="; pm2 logs cybersarah --lines 30 --nostream 2>&1 | tail -35
            echo "== lokale Health-Checks =="
            curl -sS -o /dev/null -w "GET /api/health HTTP %{http_code}\n" -m 10 http://127.0.0.1:3000/api/health || echo "Backend auf 3000 nicht erreichbar"
            curl -sS -o /dev/null -w "GET / HTTP %{http_code}\n" -m 10 http://127.0.0.1:3000/ || echo "Root nicht erreichbar"
            echo "== Ressourcen =="; df -h / | tail -1; free -m | head -2
            echo "== Node/PNPM =="; node -v 2>/dev/null; pnpm -v 2>/dev/null || true
            echo "== /opt/cybersarah =="; cd /opt/cybersarah 2>/dev/null && git log --oneline -1 && ls artifacts/api-server/.env >/dev/null 2>&1 && echo ".env vorhanden" || echo "WARNUNG: /opt/cybersarah oder .env fehlt"
            echo "== pm2-Prozess (vollstaendig) =="; pm2 describe cybersarah 2>/dev/null | head -45
            echo "== dist des API-Servers =="; ls -la /opt/cybersarah/artifacts/api-server/dist/ 2>/dev/null | head -5 || echo "kein dist"
            echo "== Env-Endpunkt direkt (Port 3000) =="
            curl -sS -X POST http://127.0.0.1:3000/api/admin/env -H "X-Deploy-Token: $DEPLOY_TOKEN" -H "Content-Type: application/json" -d '{"env":{}}' -m 10 | head -c 300; echo
            echo "== Health direkt (Port 3000) =="; curl -sS http://127.0.0.1:3000/api/health -m 10 | head -c 300; echo
            echo "== Build-Fehler reproduzieren =="; cd /opt/cybersarah && NODE_ENV=development pnpm --filter @workspace/api-server run build 2>&1 | tail -15 || true
            echo "== Alle Node/TSX-Prozesse =="; ps aux | grep -E "node|tsx|pnpm" | grep -v grep | head -15
            echo "== systemd-Einheiten (cyber) =="; systemctl list-units --all 2>/dev/null | grep -i cyber | head -5 || true
            echo "== Unit cybersarah-automation =="; systemctl cat cybersarah-automation.service 2>/dev/null | head -25 || true
            echo "== Alle Cyber-Units =="; ls /etc/systemd/system/ | grep -i cyber | head -15 || true
            echo "== cgroup des dist-Prozesses =="; for pr in $(pgrep -f "node dist/index[.]js" 2>/dev/null); do cat /proc/$pr/cgroup 2>/dev/null | head -2; ps -o pid,ppid,user,lstart -p $pr --no-headers; done || true
            echo "== cgroup des pnpm-start =="; for pr in $(pgrep -f "node /usr/bin/pnpm start" 2>/dev/null); do cat /proc/$pr/cgroup 2>/dev/null | head -2; done || true
            echo "== Unit-Status =="; systemctl status cybersarah-automation.service --no-pager 2>/dev/null | head -12 || true
            echo "== Listener =="; ss -tlnp | grep -E ":(3000|443|80)" || true
            echo "== Nginx-Vollconfig (gefiltert) =="; nginx -T 2>/dev/null | grep -nE "server_name|listen |proxy_pass|server \{|# configuration file" | head -40
            echo "== sites-enabled =="; ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
            echo "== Nginx-Upstream =="; grep -rE "proxy_pass|listen" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -20
            echo "== Nginx-Status =="; nginx -t 2>&1 | tail -2; systemctl is-active nginx
            echo "== via Nginx lokal =="; curl -sSk -o /dev/null -w "HTTPS /api/health HTTP %{http_code}" -m 10 https://127.0.0.1/api/health || true
          '

      - name: Reparatur (nur bei modus=reparatur)
        if: ${{ github.event.inputs.modus == 'reparatur' }}
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" '
            set -e
            cd /opt/cybersarah
            echo "== Code auf origin/main hart setzen =="
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -1
            echo "== .env synchronisieren =="
            test -f .env && cp .env artifacts/api-server/.env && echo ".env kopiert"
            echo "== Dependencies (devDeps inklusive — NODE_ENV muss fuer den Build development sein) =="
            echo "== Disk vorher =="; df -h / | tail -1
            CI=true NODE_ENV=development pnpm install --frozen-lockfile 2>&1 | tail -4 || CI=true NODE_ENV=development pnpm install 2>&1 | tail -4
            echo "== Disk nachher =="; df -h / | tail -1
            echo "== pnpm-Store bereinigen (Disk ~95%) =="
            pnpm store prune 2>/dev/null || true
            echo "== Workspace-Libs bauen (Voraussetzung fuer api-server-Build) =="
            pnpm run typecheck:libs
            echo "== API-Server bauen =="
            pnpm --filter @workspace/api-server run build
            echo "== frisches dist =="
            ls -la artifacts/api-server/dist/ | head -4
            echo "== pm2-Prozess-Definition =="
            pm2 describe cybersarah | grep -E "script|exec|interpreter" | head -8
            export NODE_ENV=production
            echo "== systemd cybersarah-peer MASKIEREN (Healthcheck-Timer reaktiviert ihn immer wieder) =="
            systemctl stop cybersarah-peer.service 2>/dev/null || true
            systemctl disable cybersarah-peer.service 2>/dev/null || true
            if [ -f /etc/systemd/system/cybersarah-peer.service ] && [ ! -L /etc/systemd/system/cybersarah-peer.service ]; then
              mv /etc/systemd/system/cybersarah-peer.service /etc/systemd/system/cybersarah-peer.service.unit-bak-20260927
              echo "Unit-Datei verschoben (systemctl mask verweigert bei echten Dateien)"
            fi
            [ -d /etc/systemd/system/cybersarah-peer.service.d ] && mv /etc/systemd/system/cybersarah-peer.service.d /etc/systemd/system/cybersarah-peer.service.d-bak-20260927
            systemctl daemon-reload
            systemctl mask cybersarah-peer.service 2>&1 | head -2 || true
            echo "is-enabled jetzt: $(systemctl is-enabled cybersarah-peer.service 2>&1 || true)"
            systemctl start cybersarah-peer.service 2>&1 | head -2 || true
            echo "== Wer reaktiviert peer? =="
            grep -rln "cybersarah-peer" /etc/systemd/system/ /srv/cybersarah-loop-agent/ /opt/cybersarah-automation/ 2>/dev/null | head -6
            echo "== DB-Passwort an .env-DATABASE_URL angleichen (URL-dekodiert) =="
            echo "SSH-User: $(id -un)"
            DBURL=$(grep "^DATABASE_URL=" /opt/cybersarah/.env | cut -d= -f2- | tr -d "\r\n")
            DBPW=$(python3 -c "import urllib.parse as u,sys; s=sys.argv[1]; i=s.find('://'); r=s[i+3:]; at=r.rfind('@'); up=r[:at].split(':',1); print(u.unquote(up[1]) if len(up)>1 else '')" "$DBURL" 2>/dev/null || printf "%s" "$DBURL" | sed -nE "s#^postgres(ql)?://[^:]+:([^@]+)@.*#\2#p")
            echo "Extrahierte PW-Laenge: ${#DBPW}"
            if [ -n "$DBPW" ]; then
              sudo -u postgres psql -c "ALTER USER cybersarah WITH PASSWORD \$\$${DBPW}\$\$;" 2>&1 | head -3
            else
              echo "Kein Passwort in DATABASE_URL extrahierbar"
            fi
            psql "$DBURL" -tAc "SELECT 1" >/dev/null 2>&1 && echo "DB-URL aus .env funktioniert (select 1 ok)" || echo "WARNUNG: DB-URL aus .env funktioniert NICHT"
            echo "== Verwaiste Alt-Prozesse auf Port 3000 beenden =="
            pkill -f "t[s]x artifacts/api-server" 2>/dev/null || true
            pkill -f "api-server/dist/index[.]mjs" 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 3
            ss -tlnp | grep ":3000" || echo "Port 3000 frei"
            echo "== pm2 NEU STARTEN (delete + start) — killt den veralteten Env-Cache mit altem DEPLOY_TOKEN =="
            pm2 delete cybersarah 2>/dev/null || true
            cd /opt/cybersarah
            env -u DEPLOY_TOKEN -u OPENAI_API_KEY -u STRIPE_SECRET_KEY -u DATABASE_URL pm2 start bash --name cybersarah -- -c "pnpm --filter @workspace/api-server start" || pm2 start "pnpm --filter @workspace/api-server start" --name cybersarah
            pm2 save
            echo "== 15s warten, dann Health =="
            sleep 15
            echo "== /api/health — muss JSON sein, kein HTML =="
            HEALTH=$(curl -sS -m 20 http://127.0.0.1:3000/api/health || true)
            echo "$HEALTH" | head -c 400; echo
            if echo "$HEALTH" | head -c 20 | grep -q "<!doctype\|<html"; then echo "::error::API antwortet mit HTML statt JSON"; exit 1; fi
            echo "Health: keine HTML-Antwort — OK"
            echo "== pm2 status (Endkontrolle) =="
            pm2 status | head -10
            echo "== Nginx-Upstream korrigieren (3001 -> 3000, nur cybersarah-Vhost) =="
            for f in /etc/nginx/sites-available/cybersarah /etc/nginx/sites-enabled/cybersarah; do
              [ -f "$f" ] && sed -i "s#127\.0\.0\.1:3001#127.0.0.1:3000#g" "$f" && echo "angepasst: $f"
            done
            nginx -t && systemctl reload nginx && echo "Nginx neu geladen"
            echo "== via Nginx (HTTPS lokal) =="
            curl -sSk -o /dev/null -w "HTTPS /api/health HTTP %{http_code}\n" -m 15 https://127.0.0.1/api/health
            echo "== kaputte export-Zeile aus .bashrc entfernen =="
            sed -i.bak "/AAAAB3NzaC1yc2E/d" ~/.bashrc 2>/dev/null || true
          '

      - name: Oeffentliche Verifikation (immer)
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" '
            echo "== Lokale Endkontrolle =="
            curl -sS -o /dev/null -w "HTTP :3000/api/health HTTP %{http_code}\n" -m 10 http://127.0.0.1:3000/api/health || true
          '
