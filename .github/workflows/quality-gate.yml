name: Core Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck und API-Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      # CI darf niemals Produktionsprovider oder Signing-Secrets erhalten.
      ENABLE_AUTO_PUBLISHING: "false"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Reproduzierbar installieren
        run: pnpm install --frozen-lockfile

      - name: Library-Typecheck
        run: pnpm typecheck:libs

      - name: Produktions-Build
        run: pnpm build
