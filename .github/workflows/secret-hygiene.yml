name: Secret hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked source for committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan high-confidence credential patterns
        shell: bash
        run: |
          set -Eeuo pipefail
          if git grep -I -n -E '(sk-[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{30,})' -- ':!*.lock' ':!*.md' ':!*.map' ':!*.min.js' ':!*.min.css' ':!*.snap' ':!*.sum' ':!*test*' ':!*spec*'; then
            echo "::error::Potential credential-like literal detected in tracked source. Review and rotate any genuine credential; do not paste it into logs."
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::Credential scan failed unexpectedly (git grep exit $status)."
              exit "$status"
            fi
          fi
          echo "Secret hygiene scan passed: no high-confidence credential patterns found in scanned tracked source."
